<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kỷ yếu 70 năm - Hành trình xây dựng và phát triển</title><style>*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:Arial,sans-serif;background:#17202a;color:#fff;overflow:hidden}.top{height:58px;background:#0d141b;display:flex;align-items:center;gap:10px;padding:0 14px;box-shadow:0 2px 10px #0008;position:relative;z-index:20}.title{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}.btn{border:1px solid #ffffff33;background:#ffffff12;color:#fff;border-radius:7px;padding:8px 12px;cursor:pointer}.btn:hover{background:#ffffff25}.pageNo{width:70px;text-align:center}.stage{height:calc(100% - 58px);display:flex;align-items:center;justify-content:center;perspective:2200px;padding:20px}.book{position:relative;width:min(72vw,760px);height:min(88vh,930px);max-height:calc(100vh - 110px);transform-style:preserve-3d;filter:drop-shadow(0 18px 28px #0008)}.page{position:absolute;inset:0;background:#fff;backface-visibility:hidden;transform-origin:left center;border-radius:2px 8px 8px 2px;overflow:hidden;box-shadow:0 0 0 1px #0002 inset;transition:transform .82s cubic-bezier(.22,.61,.36,1),box-shadow .82s}.page img{width:100%;height:100%;object-fit:contain;background:#fff;display:block}.page.flipped{transform:rotateY(-180deg);box-shadow:12px 0 24px #0004}.page::after{content:"";position:absolute;right:0;top:0;width:1px;height:100%;background:#0002}.range{width:160px}.fullscreen{margin-left:4px}.hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:12px;color:#ffffffaa;z-index:30}@media(max-width:700px){.top{height:54px}.title{font-size:13px}.btn{padding:7px 9px}.range{width:90px}.book{width:90vw;height:78vh}.stage{height:calc(100% - 54px);padding:8px}}</style></head><body><div class="top"><div class="title">KỶ YẾU 70 NĂM – HÀNH TRÌNH XÂY DỰNG VÀ PHÁT TRIỂN</div><button class="btn" id="prev">‹ Trước</button><span class="pageNo" id="label">1 / 80</span><button class="btn" id="next">Sau ›</button><input class="range" id="range" type="range" min="1" max="80" value="1"><button class="btn fullscreen" id="fs">⛶</button></div><div class="stage"><div class="book" id="book"></div></div><div class="hint">Nhấp bên phải/trái trang hoặc dùng phím ← → để lật trang</div><script>const N=80,book=document.getElementById('book'),label=document.getElementById('label'),range=document.getElementById('range');let current=1;for(let i=1;i<=N;i++){const p=document.createElement('div');p.className='page';p.dataset.page=i;p.style.zIndex=N-i+1;const im=document.createElement('img');im.loading=i<4?'eager':'lazy';im.src=`pages/page-${String(i).padStart(3,'0')}.webp`;im.alt=`Trang ${i}`;p.appendChild(im);book.appendChild(p)}const pages=[...document.querySelectorAll('.page')];function go(n){n=Math.max(1,Math.min(N,n));current=n;pages.forEach((p,i)=>p.classList.toggle('flipped',i<n-1));label.textContent=`${n} / ${N}`;range.value=n}document.getElementById('next').onclick=()=>go(current<N?current+1:N);document.getElementById('prev').onclick=()=>go(current>1?current-1:1);range.oninput=e=>go(+e.target.value);book.addEventListener('click',e=>{let r=book.getBoundingClientRect();go(e.clientX-r.left>r.width/2?current+1:current-1)});document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(current+1);if(e.key==='ArrowLeft')go(current-1);if(e.key==='Home')go(1);if(e.key==='End')go(N)});document.getElementById('fs').onclick=()=>document.documentElement.requestFullscreen?.();go(1);</script></body></html>
